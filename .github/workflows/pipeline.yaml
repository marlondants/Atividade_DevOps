name: CI - Verificacao HTML

"on":
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  verificar:
    name: Verificar projeto
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Verificar arquivos obrigatorios
        run: |
          test -f index.html
          echo "index.html encontrado"

      - name: Verificar links entre paginas
        shell: bash
        run: |
          for f in *.html; do
            [ -f "$f" ] || continue

            for alvo in $(grep -oE '(href|action)="[^"#]+\.html"' "$f" | cut -d'"' -f2); do
              if [ ! -f "$alvo" ]; then
                echo "ERRO: $f aponta para $alvo, que nao existe"
                exit 1
              fi
            done
          done

          echo "Todos os links estao corretos"

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar o HTML
        run: npx --yes htmlhint "**/*.html"
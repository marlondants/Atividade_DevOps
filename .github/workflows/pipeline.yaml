name: Pipeline - Atividade DevOps

# Eventos que iniciam a esteira
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparacao:
    name: 1 - Preparacao
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v6

      - name: Conferir arquivos obrigatorios
        run: |
          for arquivo in index.html cadastro.html painel_login.html style.css; do
            if [ ! -s "$arquivo" ]; then
              echo "::error::Arquivo ausente ou vazio: $arquivo"
              exit 1
            fi
            echo "OK: $arquivo"
          done

  validacao:
    name: 2 - Validacao de links
    needs: preparacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verificar links, CSS e destino dos formularios
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          class Referencias(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []

              def handle_starttag(self, tag, attrs):
                  atributos = dict(attrs)
                  for atributo in ('href', 'src', 'action'):
                      if atributo in atributos and atributos[atributo]:
                          self.urls.append(atributos[atributo])

          for arquivo in sorted(Path('.').glob('*.html')):
              parser = Referencias()
              parser.feed(arquivo.read_text(encoding='utf-8'))
              for endereco in parser.urls:
                  url = urlsplit(endereco)
                  if url.scheme or url.netloc or not url.path:
                      continue  # URL externa ou ancora da pagina
                  destino = arquivo.parent / unquote(url.path)
                  if not destino.is_file():
                      raise SystemExit(
                          f'ERRO: {arquivo} aponta para {endereco}, que nao existe'
                      )
                  print(f'OK: {arquivo} -> {endereco}')
          print('Todos os links e arquivos de estilo foram encontrados.')
          PY

  testes:
    name: 3 - Testes dos formularios
    needs: validacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Testar estrutura do login, cadastro e painel
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Pagina(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.formularios = []
                  self.campos = []
                  self.botoes = []
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'form':
                      self.formularios.append(a)
                  elif tag == 'input':
                      self.campos.append(a)
                  elif tag == 'button':
                      self.botoes.append(a)
                  elif tag == 'a':
                      self.links.append(a.get('href'))

          def verificar_formulario(nome, destino, tipos):
              pagina = Pagina()
              pagina.feed(Path(nome).read_text(encoding='utf-8'))
              assert any(f.get('action') == destino for f in pagina.formularios), (
                  f'{nome}: formulario nao aponta para {destino}'
              )
              for tipo in tipos:
                  assert any(c.get('type') == tipo and 'required' in c
                             for c in pagina.campos), (
                      f'{nome}: campo obrigatorio do tipo {tipo} ausente'
                  )
              assert any(c.get('type') == 'password' and
                         int(c.get('minlength', '0')) >= 6
                         for c in pagina.campos), (
                  f'{nome}: senha deve ter minlength >= 6'
              )
              assert any(b.get('type') == 'submit' for b in pagina.botoes), (
                  f'{nome}: botao submit nao encontrado'
              )
              print(f'OK: formulario de {nome}')

          verificar_formulario('index.html', 'painel_login.html',
                               ('email', 'password'))
          verificar_formulario('cadastro.html', 'index.html',
                               ('text', 'email', 'password'))
          painel = Pagina()
          painel.feed(Path('painel_login.html').read_text(encoding='utf-8'))
          assert 'index.html' in painel.links, 'Painel sem link para voltar ao login'
          css = Path('style.css').read_text(encoding='utf-8')
          assert '.card' in css and 'button' in css, 'Estilos principais nao encontrados'
          print('OK: navegacao do painel e estilos principais')
          PY

  # ---------------------------------------------------------------
  # NOVO: SAST = analisa o CODIGO-FONTE, sem executar o site
  # ---------------------------------------------------------------
  sast:
    name: 4 - SAST (analise estatica com Semgrep)
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Instalar o Semgrep
        run: pipx install semgrep

      - name: Rodar o Semgrep no codigo-fonte
        run: |
          semgrep scan \
            --config p/default \
            --config .semgrep/regras.yml \
            --metrics=off \
            --error \
            --json-output=semgrep-resultado.json \
            .

      - name: Validar o resultado do SAST
        run: |
          python3 - <<'PY'
          import json
          dados = json.load(open('semgrep-resultado.json'))
          achados = dados.get('results', [])
          erros = dados.get('errors', [])
          print(f'Achados de seguranca: {len(achados)}')
          print(f'Erros de execucao do Semgrep: {len(erros)}')
          for a in achados:
              print(f"- {a['check_id']} em {a['path']}:{a['start']['line']}")
          if achados:
              raise SystemExit('ERRO: o SAST encontrou problemas de seguranca no codigo')
          print('SAST aprovado: nenhum problema encontrado.')
          PY

      - name: Guardar o relatorio do SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-sast
          path: semgrep-resultado.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # NOVO: DAST = ataca o SITE FUNCIONANDO, de fora, com OWASP ZAP
  # ---------------------------------------------------------------
  dast:
    name: 5 - DAST (teste dinamico com OWASP ZAP)
    needs: sast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Subir o site e escanear com o ZAP
        run: |
          mkdir -p _site zap-report
          cp index.html cadastro.html painel_login.html style.css _site/
          chmod 777 zap-report

          # liga um servidor local para o ZAP poder "visitar" o site
          python3 -m http.server 8080 --directory _site > /dev/null 2>&1 &
          SERVIDOR=$!
          trap 'kill $SERVIDOR' EXIT

          # validacao 1: o site precisa estar no ar antes do ataque
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/index.html > /dev/null && break
            sleep 1
          done
          if ! curl -sf http://localhost:8080/index.html > /dev/null; then
            echo "::error::O site de teste nao iniciou"
            exit 1
          fi
          echo "Site no ar em http://localhost:8080"

          # ataque simulado (baseline scan do OWASP ZAP)
          docker run --rm --network host \
            -v "$PWD/zap-report:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 \
            -r zap-report.html -J zap-report.json -m 1 -I

      - name: Validar o resultado do DAST
        run: |
          python3 - <<'PY'
          import json
          dados = json.load(open('zap-report/zap-report.json'))
          nomes = {'3': 'ALTO', '2': 'MEDIO', '1': 'BAIXO', '0': 'INFORMATIVO'}
          contagem = {'3': 0, '2': 0, '1': 0, '0': 0}
          for site in dados.get('site', []):
              for alerta in site.get('alerts', []):
                  codigo = str(alerta.get('riskcode', '0'))
                  contagem[codigo] = contagem.get(codigo, 0) + 1
                  print(f"[{nomes.get(codigo, codigo)}] {alerta.get('name')}")
          print('Resumo:', {nomes[c]: n for c, n in contagem.items()})
          if contagem['3'] > 0:
              raise SystemExit('ERRO: o DAST encontrou vulnerabilidade de risco ALTO')
          print('DAST aprovado: nenhuma vulnerabilidade de risco alto.')
          PY

      - name: Guardar o relatorio do DAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-dast
          path: zap-report/
          if-no-files-found: ignore

  publicacao:
    name: 6 - Publicacao no GitHub Pages
    needs: dast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Montar site estatico
        run: |
          mkdir -p _site
          cp index.html cadastro.html painel_login.html style.css _site/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos para publicacao
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
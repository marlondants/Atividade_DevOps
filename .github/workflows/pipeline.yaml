name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Verificar se os links entre páginas existem
        run: |
          for f in *.html; do
            for alvo in $(grep -oE '(href|action)="[^"#]+\.html"' "$f" | cut -d'"' -f2); do
              if [ ! -f "$alvo" ]; then
                echo "ERRO: $f aponta para $alvo, que não existe"
                exit 1
              fi
            done
          done
          echo "Todos os links estão corretos"

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar o HTML
        run: npx --yes htmlhint "*.html"